<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Balls in Spinning Hexagon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        canvas {
            display: block;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="instructions">Click to add balls • Spacebar to pause</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const HEXAGON_RADIUS = 280;
        const GRAVITY = 500;
        const AIR_FRICTION = 0.995;
        const WALL_BOUNCE = 0.75;
        const BALL_BOUNCE = 0.9;
        const ROTATION_SPEED = 0.5;
        const SUBSTEPS = 4;

        let hexagonAngle = 0;
        let paused = false;
        let lastTime = 0;

        const ballColors = [
            '#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3',
            '#f38181', '#aa96da', '#fcbad3', '#a8d8ea',
            '#ff9a8b', '#88d8b0', '#ffcc5c', '#ff6b6b'
        ];

        class Ball {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 300;
                this.vy = (Math.random() - 0.5) * 300;
                this.mass = radius * radius;
            }

            update(dt) {
                this.vy += GRAVITY * dt;
                this.vx *= AIR_FRICTION;
                this.vy *= AIR_FRICTION;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3,
                    this.y - this.radius * 0.3,
                    0,
                    this.x,
                    this.y,
                    this.radius
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.2, this.color);
                gradient.addColorStop(1, this.darkenColor(this.color, 0.4));
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.restore();
            }

            darkenColor(hex, factor) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgb(${Math.floor(r * factor)}, ${Math.floor(g * factor)}, ${Math.floor(b * factor)})`;
            }
        }

        let balls = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function getHexagonVertices(angle) {
            const vertices = [];
            for (let i = 0; i < 6; i++) {
                const a = angle + (i * Math.PI * 2) / 6;
                vertices.push({
                    x: centerX + HEXAGON_RADIUS * Math.cos(a),
                    y: centerY + HEXAGON_RADIUS * Math.sin(a)
                });
            }
            return vertices;
        }

        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lengthSq = dx * dx + dy * dy;
            
            if (lengthSq === 0) return { distance: Math.hypot(px - x1, py - y1), closestX: x1, closestY: y1, t: 0 };
            
            let t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lengthSq));
            const closestX = x1 + t * dx;
            const closestY = y1 + t * dy;
            
            return {
                distance: Math.hypot(px - closestX, py - closestY),
                closestX,
                closestY,
                t,
                normalX: (px - closestX) / Math.max(Math.hypot(px - closestX, py - closestY), 0.001),
                normalY: (py - closestY) / Math.max(Math.hypot(px - closestX, py - closestY), 0.001)
            };
        }

        function handleWallCollisions(ball, vertices) {
            for (let i = 0; i < 6; i++) {
                const v1 = vertices[i];
                const v2 = vertices[(i + 1) % 6];
                
                const result = pointToSegmentDistance(ball.x, ball.y, v1.x, v1.y, v2.x, v2.y);
                
                if (result.distance < ball.radius) {
                    const overlap = ball.radius - result.distance;
                    
                    ball.x += result.normalX * overlap;
                    ball.y += result.normalY * overlap;
                    
                    const dotProduct = ball.vx * result.normalX + ball.vy * result.normalY;
                    ball.vx -= 2 * dotProduct * result.normalX;
                    ball.vy -= 2 * dotProduct * result.normalY;
                    
                    ball.vx *= WALL_BOUNCE;
                    ball.vy *= WALL_BOUNCE;
                }
            }
        }

        function handleBallCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];
                    
                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = b1.radius + b2.radius;
                    
                    if (dist < minDist && dist > 0) {
                        const nx = dx / dist;
                        const ny = dy / dist;
                        
                        const overlap = minDist - dist;
                        const totalMass = b1.mass + b2.mass;
                        b1.x -= nx * overlap * (b2.mass / totalMass);
                        b1.y -= ny * overlap * (b2.mass / totalMass);
                        b2.x += nx * overlap * (b1.mass / totalMass);
                        b2.y += ny * overlap * (b1.mass / totalMass);
                        
                        const dvx = b1.vx - b2.vx;
                        const dvy = b1.vy - b2.vy;
                        const dvDotN = dvx * nx + dvy * ny;
                        
                        if (dvDotN > 0) {
                            const restitution = BALL_BOUNCE;
                            const impulse = (2 * dvDotN) / totalMass;
                            
                            b1.vx -= impulse * b2.mass * nx * restitution;
                            b1.vy -= impulse * b2.mass * ny * restitution;
                            b2.vx += impulse * b1.mass * nx * restitution;
                            b2.vy += impulse * b1.mass * ny * restitution;
                        }
                    }
                }
            }
        }

        function isInsideHexagon(x, y, vertices) {
            let inside = false;
            for (let i = 0, j = 5; i < 6; j = i++) {
                const xi = vertices[i].x, yi = vertices[i].y;
                const xj = vertices[j].x, yj = vertices[j].y;
                
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function spawnBall(x, y) {
            const radius = 15 + Math.random() * 20;
            const color = ballColors[Math.floor(Math.random() * ballColors.length)];
            
            if (x === undefined || y === undefined) {
                const vertices = getHexagonVertices(hexagonAngle);
                let attempts = 0;
                do {
                    x = centerX + (Math.random() - 0.5) * HEXAGON_RADIUS * 1.2;
                    y = centerY + (Math.random() - 0.5) * HEXAGON_RADIUS * 1.2;
                    attempts++;
                } while (!isInsideHexagon(x, y, vertices) && attempts < 100);
            }
            
            balls.push(new Ball(x, y, radius, color));
        }

        function init() {
            resize();
            for (let i = 0; i < 8; i++) {
                spawnBall();
            }
        }

        function update(dt) {
            if (paused) return;
            
            const subDt = dt / SUBSTEPS;
            
            for (let step = 0; step < SUBSTEPS; step++) {
                for (const ball of balls) {
                    ball.update(subDt);
                }
                
                const vertices = getHexagonVertices(hexagonAngle);
                for (const ball of balls) {
                    handleWallCollisions(ball, vertices);
                }
                
                handleBallCollisions();
            }
            
            hexagonAngle += ROTATION_SPEED * dt;
        }

        function draw() {
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);
            
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * 0.7);
            gradient.addColorStop(0, '#151520');
            gradient.addColorStop(1, '#0a0a0f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            const vertices = getHexagonVertices(hexagonAngle);
            
            ctx.save();
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 30;
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(vertices[0].x, vertices[0].y);
            for (let i = 1; i < 6; i++) {
                ctx.lineTo(vertices[i].x, vertices[i].y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
            
            ctx.save();
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(vertices[0].x, vertices[0].y);
            for (let i = 1; i < 6; i++) {
                ctx.lineTo(vertices[i].x, vertices[i].y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
            
            for (const ball of balls) {
                ball.draw();
            }
        }

        function gameLoop(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
            lastTime = currentTime;
            
            update(dt);
            draw();
            
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            spawnBall(x, y);
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                paused = !paused;
            }
        });

        window.addEventListener('resize', resize);

        init();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
