<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101916">
  <title>APEX / Circuit Run</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101916;
      color: #f1f2e9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px 22px 26px;
      background:
        radial-gradient(ellipse at 50% -15%, rgba(123, 151, 94, .17), transparent 55%),
        #101916;
    }

    .shell { max-width: 1380px; margin: 0 auto; }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 3px 16px;
    }

    .eyebrow, .label, .brand, .track-note, .controls, .seed {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow { color: #b9c17f; font-size: 10px; margin: 0 0 7px; }
    h1 { font-size: clamp(22px, 4vw, 34px); letter-spacing: -.055em; line-height: 1; margin: 0; font-weight: 760; }
    .brand { color: #85918a; font-size: 10px; padding-bottom: 3px; white-space: nowrap; }
    .brand span { color: #d7ddc5; }

    .game-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(220, 232, 206, .14);
      border-radius: 13px;
      background: #1d3024;
      box-shadow: 0 26px 90px rgba(0, 0, 0, .43), 0 2px 0 rgba(255, 255, 255, .025) inset;
    }

    canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; }

    .topbar {
      position: absolute;
      z-index: 2;
      top: 15px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .readouts { display: flex; gap: 7px; }
    .readout, .race-state, .button {
      border: 1px solid rgba(232, 239, 220, .16);
      background: rgba(13, 20, 17, .77);
      box-shadow: 0 5px 20px rgba(0, 0, 0, .12);
      backdrop-filter: blur(10px);
    }

    .readout { min-width: 89px; padding: 9px 12px 8px; border-radius: 7px; }
    .label { display: block; color: #99a497; font-size: 8px; margin-bottom: 4px; }
    .value { display: block; color: #f5f4e9; font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.04em; }
    .value small { color: #aab39c; font-size: 10px; font-weight: 500; letter-spacing: 0; }

    .actions { display: flex; align-items: center; gap: 7px; pointer-events: auto; }
    .race-state { display: flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 10px; color: #cbd2bf; border-radius: 6px; font-size: 10px; }
    .light { width: 6px; height: 6px; border-radius: 50%; background: #c8dd75; box-shadow: 0 0 10px rgba(200, 221, 117, .65); }
    .light.paused { background: #edb566; box-shadow: 0 0 10px rgba(237, 181, 102, .5); }
    .button { min-height: 34px; padding: 0 12px; border-radius: 6px; color: #e6eadb; font: 600 10px "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: background .15s, border-color .15s; }
    .button:hover { background: rgba(48, 62, 51, .95); border-color: rgba(232, 239, 220, .35); }

    .bottom-bar {
      position: absolute;
      z-index: 2;
      bottom: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      pointer-events: none;
    }

    .track-note { color: rgba(231, 237, 216, .74); font-size: 9px; text-shadow: 0 2px 8px #101916; }
    .seed { color: rgba(231, 237, 216, .5); font-size: 8px; }
    .key { display: inline-block; margin: 0 2px; padding: 3px 5px; border: 1px solid rgba(237, 240, 226, .29); border-radius: 3px; color: #f1f2e9; font-size: 8px; }

    .footer { display: flex; justify-content: space-between; gap: 16px; margin: 11px 3px 0; color: #86918a; font: 9px "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .footer strong { color: #c2cbaa; font-weight: 500; }

    .touch-controls { display: none; }

    @media (max-width: 720px) {
      body { padding: 18px 10px; }
      .masthead { margin: 0 2px 12px; }
      .brand { display: none; }
      .game-frame { border-radius: 8px; }
      .topbar { top: 8px; left: 8px; right: 8px; }
      .readouts { gap: 4px; }
      .readout { min-width: 0; padding: 6px 7px; }
      .label { font-size: 6px; }
      .value { font-size: 12px; }
      .actions { gap: 4px; }
      .race-state { min-height: 28px; padding: 0 7px; font-size: 8px; }
      .button { min-height: 28px; padding: 0 7px; font-size: 8px; }
      .bottom-bar { bottom: 7px; left: 8px; right: 8px; }
      .track-note { font-size: 7px; }
      .seed { display: none; }
      .footer { font-size: 7px; }
      .touch-controls { display: flex; justify-content: space-between; margin: 12px 0 0; gap: 12px; touch-action: none; }
      .touch-group { display: flex; gap: 8px; }
      .touch-controls button { width: 54px; height: 48px; border: 1px solid #3c4b3d; border-radius: 8px; background: #1a261f; color: #e7ebdc; font-size: 17px; touch-action: none; }
      .touch-controls button:active, .touch-controls button.is-down { background: #394834; }
      .touch-controls .gas { color: #d4df9c; }
    }

    @media (max-width: 430px) {
      .readout:nth-child(3) { display: none; }
      .track-note .wide { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Club series · race 01</p>
        <h1>Circuit Run</h1>
      </div>
      <div class="brand">APEX <span>///</span> MOTORSPORT</div>
    </header>

    <section class="game-frame" aria-label="Top-down racing game">
      <canvas id="game" width="1200" height="800" aria-label="Race track"></canvas>
      <div class="topbar">
        <div class="readouts" aria-live="polite">
          <div class="readout"><span class="label">Lap</span><span class="value" id="lap">01 <small>/ 03</small></span></div>
          <div class="readout"><span class="label">Race time</span><span class="value" id="time">00:00.00</span></div>
          <div class="readout"><span class="label">Position</span><span class="value" id="position">P1 <small>/ 04</small></span></div>
          <div class="readout"><span class="label">Speed</span><span class="value" id="speed">000 <small>km/h</small></span></div>
        </div>
        <div class="actions">
          <div class="race-state"><span class="light" id="state-light"></span><span id="state-label">Racing</span></div>
          <button class="button" id="pause-button" type="button">Pause</button>
          <button class="button" id="reset-button" type="button">Restart</button>
        </div>
      </div>
      <div class="bottom-bar">
        <div class="track-note"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> drive <span class="wide">· <span class="key">P</span> pause · <span class="key">R</span> restart</span></div>
        <div class="seed">SEED / 0x5EEDC0DE</div>
      </div>
    </section>

    <div class="touch-controls" aria-label="Touch driving controls">
      <div class="touch-group">
        <button type="button" data-key="left" aria-label="Steer left">←</button>
        <button type="button" data-key="right" aria-label="Steer right">→</button>
      </div>
      <div class="touch-group">
        <button type="button" data-key="brake" aria-label="Brake">▼</button>
        <button type="button" data-key="throttle" class="gas" aria-label="Accelerate">▲</button>
      </div>
    </div>

    <footer class="footer"><span>North loop <strong>· clockwise</strong></span><span>3 laps · 4 drivers</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
