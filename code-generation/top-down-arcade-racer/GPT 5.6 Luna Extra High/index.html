<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Apex — Top-Down Racer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #eff7ff;
        --muted: #91a7ba;
        --panel: rgba(9, 17, 27, 0.78);
        --line: rgba(203, 232, 255, 0.16);
        --cyan: #62f4ee;
        --orange: #ff9d5c;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        background: #061018;
      }

      .game-shell {
        position: relative;
        width: min(1120px, 100vw);
        aspect-ratio: 1120 / 720;
        overflow: hidden;
        border: 1px solid rgba(152, 218, 255, 0.22);
        border-radius: 18px;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
        background: #102329;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        inset: 18px 18px auto;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        pointer-events: none;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .hud-card {
        min-width: 178px;
        padding: 12px 15px 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
      }

      .hud-card.right { text-align: right; }
      .eyebrow { color: var(--muted); font-size: 10px; font-weight: 800; }
      .value { margin-top: 3px; font-size: 20px; font-weight: 850; letter-spacing: 0.04em; }
      .value.cyan { color: var(--cyan); }
      .subvalue { margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 700; }

      .footer {
        position: absolute;
        right: 18px;
        bottom: 16px;
        padding: 8px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: var(--panel);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .toast {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 18px 27px;
        border: 1px solid rgba(98, 244, 238, 0.32);
        border-radius: 12px;
        background: rgba(8, 19, 29, 0.86);
        box-shadow: 0 0 40px rgba(98, 244, 238, 0.1);
        color: var(--cyan);
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-align: center;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 160ms ease;
        pointer-events: none;
      }

      .toast.visible { opacity: 1; }
      .toast small { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; letter-spacing: 0.08em; }

      @media (max-width: 720px) {
        .game-shell { border: 0; border-radius: 0; }
        .hud { inset: 10px; }
        .hud-card { min-width: 0; padding: 8px 10px; }
        .value { font-size: 15px; }
        .footer { right: 10px; bottom: 10px; font-size: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="1120" height="720" aria-label="Top-down racing game"></canvas>
      <section class="hud" aria-live="polite">
        <div class="hud-card">
          <div class="eyebrow">Race telemetry</div>
          <div id="lap" class="value cyan">Lap 1 / 3</div>
          <div id="timer" class="subvalue">00:00.000</div>
        </div>
        <div class="hud-card right">
          <div class="eyebrow">Grid position</div>
          <div id="position" class="value">1st / 4</div>
          <div id="speed" class="subvalue">0 km/h</div>
        </div>
      </section>
      <div id="toast" class="toast">Race complete<small>Press R to restart</small></div>
      <div class="footer">WASD / arrows to drive · R to restart</div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
