<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down 2D Racing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #2d5a27;
            font-family: 'Arial', sans-serif;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }

        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        #instructions h3 {
            margin-bottom: 10px;
            color: #00ffcc;
        }

        #instructions p {
            margin: 5px 0;
        }

        .key {
            display: inline-block;
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="loading">Loading...</div>

    <div id="instructions">
        <h3>Controls</h3>
        <p><span class="key">W</span> or <span class="key">↑</span> - Accelerate</p>
        <p><span class="key">S</span> or <span class="key">↓</span> - Brake/Reverse</p>
        <p><span class="key">A</span> or <span class="key">←</span> - Turn Left</p>
        <p><span class="key">D</span> or <span class="key">→</span> - Turn Right</p>
        <p><span class="key">Space</span> or <span class="key">Enter</span> - Start/Restart</p>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
