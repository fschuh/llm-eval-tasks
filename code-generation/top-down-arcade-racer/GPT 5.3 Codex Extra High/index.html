<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top-Down Arcade Racer</title>
    <style>
      :root {
        --bg: #0f1814;
        --panel: rgba(4, 8, 7, 0.75);
        --text: #e9f2ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 20%, #1e2f27, #0d1411 68%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .wrap {
        width: min(1200px, 98vw);
      }

      canvas {
        width: 100%;
        height: auto;
        display: block;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
        background: #1f3a2d;
      }

      .help {
        margin-top: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--panel);
        font-size: 14px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <canvas id="game" width="1200" height="800"></canvas>
      <div class="help">Controls: W/S or Up/Down = throttle/brake, A/D or Left/Right = steer.</div>
    </div>
    <script src="./game.js"></script>
  </body>
</html>
