<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081416" />
    <title>Vector Circuit — Top-down racer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071011;
        color: #f7fbf3;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #183335 0%, #081415 58%, #050a0b 100%);
      }

      .game-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        padding: clamp(14px, 2.4vw, 34px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .top-row, .bottom-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .brand, .card, .position-card, .controls {
        border: 1px solid rgba(228, 255, 240, 0.18);
        background: linear-gradient(135deg, rgba(7, 21, 23, 0.89), rgba(13, 35, 35, 0.72));
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.27), inset 0 1px rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
      }

      .brand {
        min-width: 166px;
        padding: 11px 14px 10px;
        border-left: 3px solid #f5c64d;
      }

      .eyebrow, .label, .controls span {
        display: block;
        color: #9fb9ae;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .brand strong {
        display: block;
        margin-top: 2px;
        font-size: 19px;
        line-height: 1;
        letter-spacing: 0.04em;
      }

      .telemetry {
        display: flex;
        justify-content: center;
        gap: 9px;
      }

      .card {
        min-width: 104px;
        padding: 9px 13px 10px;
      }

      .value {
        display: block;
        margin-top: 2px;
        color: #f8fcf4;
        font-feature-settings: "tnum" 1;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .position-card {
        min-width: 112px;
        padding: 9px 14px 10px;
        text-align: right;
        border-right: 3px solid #49dcc0;
      }

      #position {
        color: #73f2d7;
        font-feature-settings: "tnum" 1;
        font-size: 25px;
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .race-state {
        align-self: flex-start;
        padding: 7px 10px;
        color: #d7e8dd;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: rgba(5, 18, 19, 0.72);
        border: 1px solid rgba(228, 255, 240, 0.14);
      }

      .controls {
        max-width: 370px;
        padding: 9px 12px;
        color: #e8f4ed;
        font-size: 12px;
        line-height: 1.4;
      }

      kbd {
        display: inline-block;
        min-width: 19px;
        margin: 0 1px;
        padding: 1px 4px;
        color: #fcfff9;
        font: 800 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
        background: rgba(255, 255, 255, 0.11);
        border: 1px solid rgba(255, 255, 255, 0.19);
        border-bottom-color: rgba(255, 255, 255, 0.36);
        border-radius: 3px;
      }

      .seed {
        align-self: flex-end;
        color: rgba(213, 236, 224, 0.63);
        font: 700 10px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.04em;
      }

      .finish-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 24px;
        pointer-events: auto;
        background: rgba(2, 12, 13, 0.69);
        opacity: 0;
        visibility: hidden;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      .finish-overlay.visible {
        opacity: 1;
        visibility: visible;
      }

      .finish-panel {
        width: min(420px, 100%);
        padding: 30px;
        text-align: center;
        background: linear-gradient(155deg, #153638, #091b1e);
        border: 1px solid rgba(242, 253, 244, 0.28);
        box-shadow: 0 22px 80px rgba(0, 0, 0, 0.55);
      }

      .finish-panel h1 {
        margin: 5px 0 4px;
        color: #f8cb56;
        font-size: clamp(36px, 7vw, 58px);
        line-height: 0.95;
        letter-spacing: -0.075em;
      }

      .finish-panel p {
        margin: 0;
        color: #d3e4da;
        font-size: 15px;
      }

      button {
        margin-top: 22px;
        padding: 11px 17px;
        color: #082023;
        font: 900 12px/1 system-ui, sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: #69e6c6;
        border: 0;
        cursor: pointer;
      }

      button:hover { background: #a0f6dd; }

      @media (max-width: 620px) {
        .hud { padding: 12px; }
        .brand { min-width: 0; padding: 8px 10px; }
        .brand strong { font-size: 15px; }
        .telemetry { gap: 5px; }
        .card { min-width: 74px; padding: 8px 9px; }
        .value, #position { font-size: 18px; }
        .position-card { min-width: 80px; padding: 8px 9px; }
        .controls { max-width: 250px; font-size: 10px; }
        .seed { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="game-shell" aria-label="Vector Circuit racing game">
      <canvas id="game" aria-label="Top-down racing circuit"></canvas>

      <section class="hud" aria-live="polite">
        <div class="top-row">
          <div class="brand">
            <span class="eyebrow">Northshore Series</span>
            <strong>VECTOR CIRCUIT</strong>
          </div>
          <div class="telemetry">
            <div class="card"><span class="label">Lap</span><span class="value" id="lap">1 / 3</span></div>
            <div class="card"><span class="label">Race time</span><span class="value" id="race-time">00:00.000</span></div>
          </div>
          <div class="position-card"><span class="label">Position</span><span id="position">1ST</span></div>
        </div>

        <div class="bottom-row">
          <div class="controls">
            <span>Drive</span>
            <kbd>W</kbd>/<kbd>↑</kbd> throttle &nbsp; <kbd>S</kbd>/<kbd>↓</kbd> brake / reverse &nbsp; <kbd>A</kbd><kbd>D</kbd> or <kbd>←</kbd><kbd>→</kbd> steer
          </div>
          <div class="race-state" id="race-state">Race in progress</div>
          <div class="seed">SIM SEED: 0xC1AC017</div>
        </div>
      </section>

      <section class="finish-overlay" id="finish-overlay" aria-modal="true" role="dialog" aria-labelledby="finish-title">
        <div class="finish-panel">
          <span class="eyebrow">Race complete</span>
          <h1 id="finish-title">1ST PLACE</h1>
          <p id="finish-detail">Final time 00:00.000</p>
          <button id="restart" type="button">Race again</button>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
