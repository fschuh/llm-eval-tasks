<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Arcade Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        #gameCanvas {
            border: 4px solid #16213e;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff88;
            font-size: 18px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #hud div {
            margin-bottom: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 6px #000;
            display: none;
            text-align: center;
        }
        #gameOver span {
            display: block;
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="700"></canvas>
        <div id="hud">
            <div id="lapDisplay">LAP: 1/3</div>
            <div id="timeDisplay">TIME: 0.00</div>
            <div id="positionDisplay">POS: 1st</div>
            <div id="speedDisplay">SPEED: 0 km/h</div>
        </div>
        <div id="gameOver">
            RACE FINISHED!<span id="finalPosition"></span>
        </div>
    </div>

    <script>
        // ============================================
        // DETERMINISTIC RNG WITH FIXED SEED
        // ============================================
        class DeterministicRNG {
            constructor(seed = 42) {
                this.seed = seed;
            }
            
            next() {
                this.seed = (this.seed * 1103515245 + 12345) & 0x7fffffff;
                return this.seed / 0x7fffffff;
            }
            
            range(min, max) {
                return min + this.next() * (max - min);
            }
        }
        
        const rng = new DeterministicRNG(42);

        // ============================================
        // CANVAS SETUP
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ============================================
        // TRACK DEFINITION - OVAL TRACK
        // ============================================
        const track = {
            centerX: canvas.width / 2,
            centerY: canvas.height / 2,
            outerRadiusX: 380,
            outerRadiusY: 280,
            innerRadiusX: 220,
            innerRadiusY: 120,
            trackWidth: 160,
            
            getCheckpoints() {
                return [
                    { x: this.centerX, y: this.centerY - 200, reached: false },  // Top
                    { x: this.centerX + 200, y: this.centerY, reached: false },  // Right
                    { x: this.centerX, y: this.centerY + 200, reached: false },  // Bottom
                    { x: this.centerX - 200, y: this.centerY, reached: false }   // Left
                ];
            },
            
            getWaypoints() {
                return [
                    { x: this.centerX, y: this.centerY - 240, targetSpeed: 0.85 },
                    { x: this.centerX + 150, y: this.centerY - 220, targetSpeed: 0.90 },
                    { x: this.centerX + 280, y: this.centerY - 140, targetSpeed: 0.95 },
                    { x: this.centerX + 320, y: this.centerY - 50, targetSpeed: 1.0 },
                    { x: this.centerX + 300, y: this.centerY + 50, targetSpeed: 1.0 },
                    { x: this.centerX + 280, y: this.centerY + 140, targetSpeed: 0.95 },
                    { x: this.centerX + 150, y: this.centerY + 220, targetSpeed: 0.90 },
                    { x: this.centerX, y: this.centerY + 240, targetSpeed: 0.85 },
                    { x: this.centerX - 150, y: this.centerY + 220, targetSpeed: 0.90 },
                    { x: this.centerX - 280, y: this.centerY + 140, targetSpeed: 0.95 },
                    { x: this.centerX - 320, y: this.centerY + 50, targetSpeed: 1.0 },
                    { x: this.centerX - 300, y: this.centerY - 50, targetSpeed: 1.0 },
                    { x: this.centerX - 280, y: this.centerY - 140, targetSpeed: 0.95 },
                    { x: this.centerX - 150, y: this.centerY - 220, targetSpeed: 0.90 }
                ];
            }
        };

        // ============================================
        // CAR CLASS
        // ============================================
        class Car {
            constructor(x, y, angle, color, isPlayer = false, name = "AI") {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.color = color;
                this.isPlayer = isPlayer;
                this.name = name;
                
                // Physics properties
                this.velocityX = 0;
                this.velocityY = 0;
                this.speed = 0;
                this.angularVelocity = 0;
                
                // Car configuration
                this.width = 24;
                this.height = 40;
                this.acceleration = 320;
                this.braking = 400;
                this.friction = 180;
                this.maxSpeed = 350;
                this.turnSpeed = 3.5;
                this.mass = 1;
                
                // Race state
                this.lap = 1;
                this.checkpointsPassed = 0;
                this.lastCheckpoint = -1;
                this.totalCheckpoints = track.getCheckpoints().length;
                this.raceTime = 0;
                this.finished = false;
                this.finishPosition = 0;
                
                // AI specific
                this.waypoints = track.getWaypoints();
                this.currentWaypoint = 0;
                this.aiSpeedMultiplier = 1;
                
                if (!isPlayer) {
                    // Random speed variation for AI
                    this.aiSpeedMultiplier = 0.85 + rng.range(0, 0.25);
                }
            }
            
            update(dt, input) {
                if (this.finished) return;
                
                this.raceTime += dt;
                
                if (this.isPlayer) {
                    this.handlePlayerInput(dt, input);
                } else {
                    this.handleAI(dt);
                }
                
                // Apply friction
                this.applyFriction(dt);
                
                // Update position
                this.x += this.velocityX * dt;
                this.y += this.velocityY * dt;
                
                // Calculate speed
                this.speed = Math.sqrt(this.velocityX * this.velocityX + this.velocityY * this.velocityY);
                
                // Handle boundary collision
                this.handleTrackBoundary();
                
                // Update checkpoints
                this.updateCheckpoints();
            }
            
            handlePlayerInput(dt, input) {
                // Acceleration / Braking
                if (input.up) {
                    this.velocityX += Math.sin(this.angle) * this.acceleration * dt;
                    this.velocityY -= Math.cos(this.angle) * this.acceleration * dt;
                }
                if (input.down) {
                    this.velocityX -= Math.sin(this.angle) * this.braking * dt;
                    this.velocityY += Math.cos(this.angle) * this.braking * dt;
                }
                
                // Steering - only when moving
                if (this.speed > 10) {
                    const turnFactor = Math.min(this.speed / 100, 1);
                    if (input.left) {
                        this.angle -= this.turnSpeed * turnFactor * dt;
                    }
                    if (input.right) {
                        this.angle += this.turnSpeed * turnFactor * dt;
                    }
                }
                
                // Clamp speed
                const currentSpeed = Math.sqrt(this.velocityX * this.velocityX + this.velocityY * this.velocityY);
                if (currentSpeed > this.maxSpeed) {
                    const scale = this.maxSpeed / currentSpeed;
                    this.velocityX *= scale;
                    this.velocityY *= scale;
                }
            }
            
            handleAI(dt) {
                const target = this.waypoints[this.currentWaypoint];
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // Calculate target angle
                const targetAngle = Math.atan2(dx, -dy);
                
                // Normalize angle difference
                let angleDiff = targetAngle - this.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                
                // Steer towards target
                const steerAmount = Math.min(Math.abs(angleDiff), this.turnSpeed * dt);
                this.angle += Math.sign(angleDiff) * steerAmount;
                
                // Accelerate based on upcoming turn
                const speedFactor = target.targetSpeed * this.aiSpeedMultiplier;
                const targetSpeed = this.maxSpeed * speedFactor;
                
                if (this.speed < targetSpeed) {
                    this.velocityX += Math.sin(this.angle) * this.acceleration * 0.7 * dt;
                    this.velocityY -= Math.cos(this.angle) * this.acceleration * 0.7 * dt;
                } else {
                    // Coast
                    this.velocityX *= 0.99;
                    this.velocityY *= 0.99;
                }
                
                // Advance to next waypoint
                if (distance < 60) {
                    this.currentWaypoint = (this.currentWaypoint + 1) % this.waypoints.length;
                }
            }
            
            applyFriction(dt) {
                const frictionForce = this.friction * dt;
                const currentSpeed = Math.sqrt(this.velocityX * this.velocityX + this.velocityY * this.velocityY);
                
                if (currentSpeed > 0) {
                    const frictionX = -this.velocityX / currentSpeed * Math.min(frictionForce, currentSpeed);
                    const frictionY = -this.velocityY / currentSpeed * Math.min(frictionForce, currentSpeed);
                    this.velocityX += frictionX;
                    this.velocityY += frictionY;
                }
            }
            
            handleTrackBoundary() {
                // Check if car is outside the track (either outside outer or inside inner)
                const dx = (this.x - track.centerX) / track.outerRadiusX;
                const dy = (this.y - track.centerY) / track.outerRadiusY;
                const outerDist = dx * dx + dy * dy;
                
                const innerDx = (this.x - track.centerX) / track.innerRadiusX;
                const innerDy = (this.y - track.centerY) / track.innerRadiusY;
                const innerDist = innerDx * innerDx + innerDy * innerDy;
                
                let collision = false;
                let normalX = 0;
                let normalY = 0;
                
                if (outerDist > 1) {
                    // Outside outer boundary
                    collision = true;
                    const dist = Math.sqrt(outerDist);
                    normalX = (this.x - track.centerX) / dist / track.outerRadiusX;
                    normalY = (this.y - track.centerY) / dist / track.outerRadiusY;
                    const len = Math.sqrt(normalX * normalX + normalY * normalY);
                    normalX /= len;
                    normalY /= len;
                    
                    // Push back to boundary
                    const targetX = track.centerX + (this.x - track.centerX) / dist;
                    const targetY = track.centerY + (this.y - track.centerY) / dist;
                    this.x = track.centerX + normalX * track.outerRadiusX * 0.99;
                    this.y = track.centerY + normalY * track.outerRadiusY * 0.99;
                } else if (innerDist < 1) {
                    // Inside inner boundary
                    collision = true;
                    const dist = Math.sqrt(innerDist);
                    normalX = (this.x - track.centerX) / dist / track.innerRadiusX;
                    normalY = (this.y - track.centerY) / dist / track.innerRadiusY;
                    const len = Math.sqrt(normalX * normalX + normalY * normalY);
                    normalX /= len;
                    normalY /= len;
                    
                    // Push back to boundary
                    this.x = track.centerX + normalX * track.innerRadiusX * 1.01;
                    this.y = track.centerY + normalY * track.innerRadiusY * 1.01;
                }
                
                if (collision) {
                    // Bounce with energy loss
                    const dot = this.velocityX * normalX + this.velocityY * normalY;
                    this.velocityX -= 2 * dot * normalX * 0.5;
                    this.velocityY -= 2 * dot * normalY * 0.5;
                    this.speed *= 0.5;
                }
            }
            
            updateCheckpoints() {
                const checkpoints = track.getCheckpoints();
                const startLineY = track.centerY - track.innerRadiusY - 10;
                
                // Check start/finish line (top of track)
                if (this.y < startLineY && this.lastCheckpoint !== 0) {
                    if (this.lastCheckpoint === checkpoints.length - 1 || this.checkpointsPassed >= this.totalCheckpoints - 1) {
                        // Completed a lap
                        this.lap++;
                        if (this.lap > 3) {
                            this.finished = true;
                        }
                        this.checkpointsPassed = 0;
                    }
                    this.lastCheckpoint = 0;
                }
                
                // Check other checkpoints
                for (let i = 1; i < checkpoints.length; i++) {
                    const cp = checkpoints[i];
                    const dx = this.x - cp.x;
                    const dy = this.y - cp.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 80 && this.lastCheckpoint === i - 1) {
                        this.lastCheckpoint = i;
                        this.checkpointsPassed++;
                    }
                }
            }
            
            getCorners() {
                const cos = Math.cos(this.angle);
                const sin = Math.sin(this.angle);
                const hw = this.width / 2;
                const hh = this.height / 2;
                
                return [
                    { x: this.x + sin * hh + cos * hw, y: this.y - cos * hh + sin * hw },
                    { x: this.x + sin * hh - cos * hw, y: this.y - cos * hh - sin * hw },
                    { x: this.x - sin * hh - cos * hw, y: this.y + cos * hh - sin * hw },
                    { x: this.x - sin * hh + cos * hw, y: this.y + cos * hh + sin * hw }
                ];
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Car body
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                
                // Car details - windshield
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(-this.width / 2 + 3, -this.height / 2 + 8, this.width - 6, 10);
                
                // Rear window
                ctx.fillRect(-this.width / 2 + 4, this.height / 2 - 12, this.width - 8, 6);
                
                // Racing stripe
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(-2, -this.height / 2, 4, this.height);
                
                // Headlights
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(-this.width / 2 + 2, -this.height / 2, 5, 3);
                ctx.fillRect(this.width / 2 - 7, -this.height / 2, 5, 3);
                
                ctx.restore();
            }
        }

        // ============================================
        // COLLISION DETECTION & RESPONSE
        // ============================================
        function checkCarCollision(car1, car2) {
            const corners1 = car1.getCorners();
            const corners2 = car2.getCorners();
            
            // Simple circle-based collision for now (more efficient)
            const dx = car2.x - car1.x;
            const dy = car2.y - car1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = (car1.width + car2.width) / 2;
            
            return dist < minDist;
        }
        
        function resolveCarCollision(car1, car2) {
            const dx = car2.x - car1.x;
            const dy = car2.y - car1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist === 0) return;
            
            // Normalize
            const nx = dx / dist;
            const ny = dy / dist;
            
            // Separate cars
            const overlap = (car1.width + car2.width) / 2 - dist;
            if (overlap > 0) {
                car1.x -= nx * overlap / 2;
                car1.y -= ny * overlap / 2;
                car2.x += nx * overlap / 2;
                car2.y += ny * overlap / 2;
            }
            
            // Relative velocity
            const dvx = car1.velocityX - car2.velocityX;
            const dvy = car1.velocityY - car2.velocityY;
            
            // Relative velocity along collision normal
            const dvn = dvx * nx + dvy * ny;
            
            // Only resolve if objects are approaching
            if (dvn > 0) return;
            
            // Impulse magnitude
            const restitution = 0.5; // Bounciness
            const impulse = -(1 + restitution) * dvn / 2;
            
            // Apply impulse
            car1.velocityX += impulse * nx;
            car1.velocityY += impulse * ny;
            car2.velocityX -= impulse * nx;
            car2.velocityY -= impulse * ny;
        }

        // ============================================
        // GAME STATE
        // ============================================
        let cars = [];
        let gameStarted = false;
        let gameTime = 0;
        let finishedCars = 0;
        
        function initGame() {
            cars = [];
            
            // Player car - starts at front of grid
            const player = new Car(
                track.centerX - 30,
                track.centerY - track.innerRadiusY - 30,
                Math.PI / 2,
                '#ff3366',
                true,
                "Player"
            );
            cars.push(player);
            
            // AI opponents - staggered starting positions
            const aiConfigs = [
                { x: track.centerX + 30, y: track.centerY - track.innerRadiusY - 30, color: '#3366ff', name: "Blue" },
                { x: track.centerX - 50, y: track.centerY - track.innerRadiusY - 80, color: '#33ff66', name: "Green" },
                { x: track.centerX + 50, y: track.centerY - track.innerRadiusY - 80, color: '#ffff33', name: "Yellow" }
            ];
            
            aiConfigs.forEach(config => {
                const ai = new Car(
                    config.x,
                    config.y,
                    Math.PI / 2,
                    config.color,
                    false,
                    config.name
                );
                cars.push(ai);
            });
            
            // Set different starting waypoints for AI
            cars[1].currentWaypoint = 0;
            cars[2].currentWaypoint = 1;
            cars[3].currentWaypoint = 2;
            
            gameTime = 0;
            finishedCars = 0;
            gameStarted = true;
            
            document.getElementById('gameOver').style.display = 'none';
        }

        // ============================================
        // INPUT HANDLING
        // ============================================
        const input = {
            up: false,
            down: false,
            left: false,
            right: false
        };
        
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w':
                case 'arrowup':
                    input.up = true;
                    break;
                case 's':
                case 'arrowdown':
                    input.down = true;
                    break;
                case 'a':
                case 'arrowleft':
                    input.left = true;
                    break;
                case 'd':
                case 'arrowright':
                    input.right = true;
                    break;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w':
                case 'arrowup':
                    input.up = false;
                    break;
                case 's':
                case 'arrowdown':
                    input.down = false;
                    break;
                case 'a':
                case 'arrowleft':
                    input.left = false;
                    break;
                case 'd':
                case 'arrowright':
                    input.right = false;
                    break;
            }
        });

        // ============================================
        // FIXED TIMESTEP GAME LOOP
        // ============================================
        const TARGET_FPS = 60;
        const FIXED_DT = 1 / TARGET_FPS;
        let accumulator = 0;
        let lastTime = 0;
        
        function gameLoop(currentTime) {
            if (!lastTime) lastTime = currentTime;
            const frameTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            accumulator += frameTime;
            
            // Update physics with fixed timestep
            while (accumulator >= FIXED_DT) {
                if (gameStarted) {
                    gameTime += FIXED_DT;
                    
                    // Update all cars
                    cars.forEach(car => car.update(FIXED_DT, input));
                    
                    // Check collisions between all car pairs
                    for (let i = 0; i < cars.length; i++) {
                        for (let j = i + 1; j < cars.length; j++) {
                            if (checkCarCollision(cars[i], cars[j])) {
                                resolveCarCollision(cars[i], cars[j]);
                            }
                        }
                    }
                    
                    // Update positions and check for finishes
                    cars.forEach((car, index) => {
                        if (car.finished && car.finishPosition === 0) {
                            finishedCars++;
                            car.finishPosition = finishedCars;
                            
                            if (car.isPlayer) {
                                document.getElementById('gameOver').style.display = 'block';
                                const positionSuffix = getPositionSuffix(finishedCars);
                                document.getElementById('finalPosition').textContent = 
                                    `You finished ${finishedCars}${positionSuffix}!`;
                            }
                        }
                    });
                }
                
                accumulator -= FIXED_DT;
            }
            
            // Render
            render();
            
            // Update HUD
            updateHUD();
            
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // RENDERING
        // ============================================
        function render() {
            // Clear canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw track background (grass)
            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw outer track boundary
            ctx.beginPath();
            ctx.ellipse(track.centerX, track.centerY, track.outerRadiusX, track.outerRadiusY, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#444444';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Draw inner track boundary (hole)
            ctx.beginPath();
            ctx.ellipse(track.centerX, track.centerY, track.innerRadiusX, track.innerRadiusY, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2d5a27';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Draw racing line (dashed center line)
            ctx.beginPath();
            ctx.ellipse(track.centerX, track.centerY, 
                (track.outerRadiusX + track.innerRadiusX) / 2, 
                (track.outerRadiusY + track.innerRadiusY) / 2, 0, 0, Math.PI * 2);
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 20]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw start/finish line
            const startY = track.centerY - (track.innerRadiusY + track.trackWidth / 2);
            ctx.beginPath();
            ctx.moveTo(track.centerX - 60, startY);
            ctx.lineTo(track.centerX + 60, startY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.stroke();
            
            // Draw checkered pattern on start line
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 12; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.fillRect(track.centerX - 60 + i * 30, startY - 6 + j * 6, 15, 3);
                    }
                }
            }
            
            // Draw waypoints (debug - commented out)
            /*
            ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
            track.getWaypoints().forEach((wp, i) => {
                ctx.beginPath();
                ctx.arc(wp.x, wp.y, 8, 0, Math.PI * 2);
                ctx.fill();
            });
            */
            
            // Sort cars by Y position for simple depth sorting
            const sortedCars = [...cars].sort((a, b) => a.y - b.y);
            
            // Draw all cars
            sortedCars.forEach(car => car.draw(ctx));
        }

        // ============================================
        // HUD UPDATE
        // ============================================
        function updateHUD() {
            const player = cars[0];
            
            // Current lap (cap at 3)
            const displayLap = Math.min(player.lap, 3);
            document.getElementById('lapDisplay').textContent = `LAP: ${displayLap}/3`;
            
            // Race time
            document.getElementById('timeDisplay').textContent = `TIME: ${gameTime.toFixed(2)}`;
            
            // Position calculation
            const positions = getPositions();
            const playerPos = positions.indexOf(0) + 1;
            const positionSuffix = getPositionSuffix(playerPos);
            document.getElementById('positionDisplay').textContent = `POS: ${playerPos}${positionSuffix}`;
            
            // Speed (convert to roughly km/h)
            const speedKmh = Math.round(player.speed * 1.5);
            document.getElementById('speedDisplay').textContent = `SPEED: ${speedKmh} km/h`;
        }
        
        function getPositions() {
            // Sort by: finished (with finish position), then lap, then checkpoint, then distance to next waypoint
            return cars.map((car, index) => {
                if (car.finished) return { index, score: car.finishPosition * 10000 };
                return { 
                    index, 
                    score: car.lap * 1000 + car.checkpointsPassed * 100 + car.currentWaypoint 
                };
            }).sort((a, b) => a.score - b.score).map(x => x.index);
        }
        
        function getPositionSuffix(pos) {
            if (pos === 1) return 'st';
            if (pos === 2) return 'nd';
            if (pos === 3) return 'rd';
            return 'th';
        }

        // ============================================
        // START GAME
        // ============================================
        initGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
