<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Arcade Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        #gameCanvas {
            display: block;
            background: #2d2d44;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            border: 2px solid #4a4a6a;
        }
        .hud-panel h3 {
            color: #ffd700;
            margin-bottom: 5px;
            font-size: 14px;
            text-transform: uppercase;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #aaa;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
        <div id="hud">
            <div class="hud-panel">
                <h3>Lap</h3>
                <span id="lapDisplay">1 / 3</span>
            </div>
            <div class="hud-panel">
                <h3>Time</h3>
                <span id="timeDisplay">00:00.000</span>
            </div>
            <div class="hud-panel">
                <h3>Position</h3>
                <span id="positionDisplay">1 / 4</span>
            </div>
            <div class="hud-panel">
                <h3>Best Lap</h3>
                <span id="bestLapDisplay">--:--.---</span>
            </div>
        </div>
        <div id="controls">
            Controls: W/↑ Accelerate | S/↓ Brake | A/← Left | D/→ Right | R Restart
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
