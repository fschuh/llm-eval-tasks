<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down 2D Racing Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 10px #00ffcc;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #2b2b2b;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .hud-item {
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        .hud-value {
            color: #00ffcc;
        }
        #controls-hint {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Neon Drift Racing</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
        <div id="hud">
            <div class="hud-item">Lap: <span id="hud-lap" class="hud-value">1/3</span></div>
            <div class="hud-item">Pos: <span id="hud-pos" class="hud-value">1st</span></div>
            <div class="hud-item">Time: <span id="hud-time" class="hud-value">0.00</span></div>
            <div class="hud-item" style="color:#aaa; font-size:14px; margin-top:10px;">Steer: Arrow Keys / WASD</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
