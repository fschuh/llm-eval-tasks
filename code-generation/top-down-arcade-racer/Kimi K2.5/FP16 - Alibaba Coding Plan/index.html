<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down 2D Racing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #00ff00;
        }
        
        #gameContainer {
            position: relative;
            border: 2px solid #444;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        #gameCanvas {
            display: block;
            background-color: #0a0a0a;
        }
        
        #controls {
            margin-top: 15px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 4px;
            text-align: center;
        }
        
        #controls h3 {
            margin-bottom: 10px;
            color: #ffff00;
        }
        
        #controls p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .key {
            display: inline-block;
            padding: 2px 8px;
            background-color: #444;
            border-radius: 3px;
            font-family: monospace;
            font-weight: bold;
            color: #00ff00;
        }
        
        #info {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🏁 Top-Down 2D Racing Game</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
    </div>
    
    <div id="controls">
        <h3>Controls</h3>
        <p><span class="key">↑</span> <span class="key">W</span> - Accelerate</p>
        <p><span class="key">↓</span> <span class="key">S</span> - Brake/Reverse</p>
        <p><span class="key">←</span> <span class="key">A</span> - Turn Left</p>
        <p><span class="key">→</span> <span class="key">D</span> - Turn Right</p>
        <p><span class="key">SPACE</span> - Start/Restart Race</p>
        <p><span class="key">P</span> - Pause | <span class="key">R</span> - Reset</p>
    </div>
    
    <div id="info">
        <p>Green car = Player | Yellow/Orange/Red = AI Opponents</p>
    </div>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
