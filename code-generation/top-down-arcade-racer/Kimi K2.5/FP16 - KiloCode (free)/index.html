<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down 2D Racing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
        <div id="instructions">
            <h2>Top-Down Racing</h2>
            <p><strong>Controls:</strong></p>
            <ul>
                <li>Arrow Up / W - Accelerate</li>
                <li>Arrow Down / S - Brake/Reverse</li>
                <li>Arrow Left / A - Turn Left</li>
                <li>Arrow Right / D - Turn Right</li>
                <li>R - Restart Race</li>
            </ul>
            <p>Race against 3 AI opponents. Complete 3 laps to win!</p>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
